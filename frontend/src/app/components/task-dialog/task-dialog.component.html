<h2 mat-dialog-title>
    {{ isCreate ? 'Nova tarefa' : 'Editar tarefa' }}
</h2>

<div mat-dialog-content class="dialog-content">
    <form [formGroup]="form" class="form">
        <mat-form-field appearance="outline">
            <mat-label>Título</mat-label>
            <input matInput formControlName="title" maxlength="100" />
            <mat-hint align="end">{{ form.value.title?.length || 0 }}/100</mat-hint>

            <mat-error *ngIf="form.controls.title.hasError('required')">Título é obrigatório</mat-error>
            <mat-error *ngIf="form.controls.title.hasError('minlength')">Mínimo 3 caracteres</mat-error>
            <mat-error *ngIf="form.controls.title.hasError('maxlength')">Máximo 100 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Descrição</mat-label>
            <textarea matInput formControlName="description" maxlength="500" rows="3"></textarea>
            <mat-hint align="end">{{ form.value.description?.length || 0 }}/500</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
                <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Vencimento</mat-label>
            <input matInput [matDatepicker]="picker" formControlName="dueDate" inputmode="numeric"
                placeholder="dd/mm/aaaa" (keydown)="blockNonDateKeys($event)" />
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </form>
</div>

<div mat-dialog-actions align="end" class="actions">
    <button mat-button type="button" (click)="close()">Cancelar</button>
    <button mat-raised-button color="primary" type="button" [disabled]="form.invalid" (click)="save()">
        Salvar
    </button>
</div>
