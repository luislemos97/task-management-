<div class="page">
  <div class="card-wrap">
    <mat-card class="card">
      <div class="brand">
        <div class="logo">TM</div>
        <div class="texts">
          <div class="title">Task Management</div>
          <div class="subtitle">Acesse com suas credenciais</div>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>Usuário</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          <mat-error *ngIf="form.controls.username.invalid && form.controls.username.touched">
            Informe o usuário
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
          <mat-error *ngIf="form.controls.password.invalid && form.controls.password.touched">
            Informe a senha
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" class="btn" [disabled]="form.invalid || submitting">
          {{ submitting ? 'Entrando...' : 'Entrar' }}
        </button>

        <div class="footnote">
          Se você não tem acesso, solicite ao administrador.
        </div>
      </form>
    </mat-card>
  </div>
</div>
